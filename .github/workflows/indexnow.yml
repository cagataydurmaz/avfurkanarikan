name: IndexNow
# main'e her push'tan sonra Vercel yayınının bitmesini bekleyip
# son 3 günde güncellenen sayfaları Bing/IndexNow'a bildirir.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vercel yayınını bekle
        run: sleep 240
      - name: IndexNow'a bildir
        run: python3 scripts/indexnow.py 3
